<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ · คลังสินค้ากลาง</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="mark-lg">WMS</div>
      <h1>คลังสินค้ากลาง</h1>
      <p class="sub">เลือกทีมของคุณแล้วกรอกรหัสผ่านเพื่อเข้าใช้งาน</p>

      <div id="config-warning" style="display:none" class="config-warning">
        ⚠️ ยังไม่ได้ตั้งค่า Supabase — แก้ไขไฟล์ <code>assets/config.js</code> ให้ใส่ URL และ anon key ของโปรเจกต์ก่อนใช้งาน
      </div>

      <div class="role-grid">
        <button class="role-btn selected" data-team="A">ทีม A</button>
        <button class="role-btn" data-team="B">ทีม B</button>
        <button class="role-btn" data-team="C">ทีม C</button>
        <button class="role-btn" data-team="ADMIN">Admin</button>
      </div>

      <label for="pw">รหัสผ่าน</label>
      <div class="pw-field">
        <input type="password" id="pw" placeholder="กรอกรหัสผ่าน" autocomplete="current-password">
        <button type="button" id="toggle-pw" class="pw-eye" aria-label="แสดง/ซ่อนรหัสผ่าน">แสดง</button>
      </div>

      <button class="btn btn-primary btn-block" id="login-btn" style="margin-top:18px;">เข้าสู่ระบบ</button>

      <div id="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // Wired up first, independent of anything below, so the show/hide
    // and team-select buttons still work even if a script below this
    // point fails to load (e.g. assets/app.js missing on the server).
    const msgEl = document.getElementById("msg");
    const btn = document.getElementById("login-btn");
    const pwEl = document.getElementById("pw");
    const toggleBtn = document.getElementById("toggle-pw");
    toggleBtn.onclick = () => {
      const isPw = pwEl.type === "password";
      pwEl.type = isPw ? "text" : "password";
      toggleBtn.textContent = isPw ? "ซ่อน" : "แสดง";
    };

    let selectedTeam = "A";
    document.querySelectorAll(".role-btn").forEach(rb => {
      rb.onclick = () => {
        document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("selected"));
        rb.classList.add("selected");
        selectedTeam = rb.dataset.team;
      };
    });

    try {
      if (typeof CONFIG_OK === "undefined" || !CONFIG_OK) {
        document.getElementById("config-warning").style.display = "block";
        if (typeof CONFIG_OK === "undefined") {
          document.getElementById("config-warning").innerHTML =
            "⚠️ โหลดไฟล์ assets/app.js หรือ assets/config.js ไม่สำเร็จ (404) — ตรวจสอบว่าอัปโหลดโฟลเดอร์ assets ขึ้น GitHub ครบแล้ว และเปิด Console (F12) ดู error";
        }
      }
      // If already logged in, skip straight to the right page.
      const existing = getSession();
      if (existing) {
        location.href = existing.team === "ADMIN" ? "admin.html" : "team.html";
      }
    } catch (e) {
      document.getElementById("config-warning").style.display = "block";
      document.getElementById("config-warning").innerHTML =
        "⚠️ โหลดสคริปต์ไม่สำเร็จ: " + (e.message || e) + " — ตรวจสอบว่าอัปโหลดโฟลเดอร์ assets ขึ้น GitHub ครบแล้ว";
    }

    async function doLogin() {
      msgEl.innerHTML = "";
      const password = pwEl.value;
      if (!password) {
        msgEl.innerHTML = `<div class="error-msg">กรุณากรอกรหัสผ่าน</div>`;
        return;
      }
      if (!CONFIG_OK) {
        msgEl.innerHTML = `<div class="error-msg">ระบบยังไม่ได้ตั้งค่า Supabase</div>`;
        return;
      }
      btn.disabled = true;
      btn.textContent = "กำลังตรวจสอบ...";
      try {
        const { data, error } = await sb().rpc("verify_login", {
          p_team: selectedTeam,
          p_password: password,
        });
        if (error) throw error;
        if (!data) {
          msgEl.innerHTML = `<div class="error-msg">รหัสผ่านไม่ถูกต้อง</div>`;
          return;
        }
        saveSession(selectedTeam, password);
        location.href = selectedTeam === "ADMIN" ? "admin.html" : "team.html";
      } catch (e) {
        msgEl.innerHTML = `<div class="error-msg">เข้าสู่ระบบไม่สำเร็จ: ${escapeHtml(e.message || String(e))}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "เข้าสู่ระบบ";
      }
    }

    btn.onclick = doLogin;
    pwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
