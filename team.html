<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สั่งซื้อสินค้า · คลังสินค้ากลาง</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="topbar-slot"></div>

  <div class="page">
    <div class="page-head">
      <h1>สั่งซื้อสินค้า</h1>
      <p>สินค้าที่แสดงคือสต็อกที่เบิกเข้าทีมนี้แล้ว — ถ้าซื้อเกินที่มี ระบบจะเบิกเพิ่มจากคลังกลางให้อัตโนมัติถ้ามีพอ</p>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="ค้นหาชื่อหรือรหัสสินค้า...">
      <button class="filter-chip active" data-f="all">ทั้งหมด</button>
      <button class="filter-chip" data-f="available">พร้อมขาย</button>
      <button class="filter-chip" data-f="out">หมด</button>
      <button class="btn btn-ghost btn-sm" id="refresh-btn" style="margin-left:auto;">รีเฟรชสต็อก</button>
    </div>

    <div id="product-grid" class="product-grid"></div>
    <div id="empty" class="empty-state" style="display:none;">ไม่พบสินค้าที่ค้นหา</div>

    <div class="section-title">ประวัติการสั่งซื้อของทีมนี้</div>
    <div class="card card-pad">
      <div class="table-wrap">
        <table>
          <thead><tr><th>วันเวลา</th><th>รายการ</th><th>มูลค่า</th><th>สถานะ</th><th></th></tr></thead>
          <tbody id="orders-body"><tr><td colspan="5" class="muted">กำลังโหลด...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Sticky cart bar -->
  <div class="page">
    <div class="cart-bar" id="cart-bar" style="display:none;">
      <div>
        <div class="count"><span id="cart-count">0</span> รายการในตะกร้า</div>
        <div class="items" id="cart-preview"></div>
      </div>
      <button class="btn btn-amber" id="open-cart-btn">ดูตะกร้า / ยืนยันซื้อ</button>
    </div>
  </div>

  <!-- Cart modal -->
  <div class="modal-backdrop" id="cart-modal" style="display:none;">
    <div class="modal">
      <h2>ตะกร้าสินค้า</h2>
      <div id="cart-lines"></div>
      <div id="cart-total" style="margin-top:10px;font-weight:700;"></div>
      <div id="cart-warn"></div>
      <div id="cart-msg"></div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="btn btn-ghost" id="cancel-cart-btn" style="flex:1;">ปิด</button>
        <button class="btn btn-primary" id="confirm-cart-btn" style="flex:2;">ยืนยันการซื้อ</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const session = requireSession("TEAM");
    renderTopbar("team");

    let products = []; // { code, name, price, team_remaining, central_remaining, combined }
    let filter = "all";
    let searchTerm = "";
    let cart = {}; // code -> qty

    function stockStatus(p) {
      if (p.combined <= 0) return "out";
      if (p.combined <= 3) return "low";
      return "ok";
    }
    function statusLabel(s) { return { ok: "พร้อมขาย", low: "ใกล้หมด", out: "หมด" }[s]; }

    async function loadProducts() {
      const [{ data: allProds, error: pErr }, { data: myStock, error: tErr }] = await Promise.all([
        sb().from("products").select("code, name, price, stock_remaining"),
        sb().from("team_stock").select("product_code, stock_remaining").eq("team", session.team),
      ]);
      if (pErr) { toast(friendlyError(pErr), true); return; }
      const teamMap = {};
      (myStock || []).forEach(r => { teamMap[r.product_code] = r.stock_remaining; });

      // แสดงเฉพาะสินค้าที่ทีมนี้เคยมีสต็อก หรือคลังกลางยังมีเหลือให้เบิกฉุกเฉินได้
      products = (allProds || [])
        .map(p => {
          const team_remaining = teamMap[p.code] || 0;
          const central_remaining = p.stock_remaining || 0;
          return {
            code: p.code, name: p.name, price: p.price,
            team_remaining, central_remaining,
            combined: team_remaining + central_remaining,
          };
        })
        .filter(p => p.team_remaining > 0 || p.central_remaining > 0)
        .sort((a, b) => a.name.localeCompare(b.name, "th"));
      renderGrid();
    }

    async function loadOrders() {
      const tbody = document.getElementById("orders-body");
      const { data: orders, error } = await sb()
        .from("orders")
        .select("id, status, created_at, order_items(qty, unit_price, product_name, from_central_qty)")
        .eq("team", session.team)
        .order("created_at", { ascending: false })
        .limit(20);
      if (error) { tbody.innerHTML = `<tr><td colspan="5" class="muted">โหลดไม่สำเร็จ</td></tr>`; return; }
      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="muted">ยังไม่มีรายการสั่งซื้อ</td></tr>`;
        return;
      }
      tbody.innerHTML = orders.map(o => {
        const items = o.order_items || [];
        const toppedUp = items.some(i => (i.from_central_qty || 0) > 0);
        const summary = items.map(i => `${escapeHtml(i.product_name)} ×${i.qty}`).join(", ");
        const total = items.reduce((s, i) => s + i.qty * (i.unit_price || 0), 0);
        const dt = new Date(o.created_at).toLocaleString("th-TH");
        const statusText = { open: "กำลังดำเนินการ", completed: "จบการขาย", cancelled: "ยกเลิกแล้ว" }[o.status] || o.status;
        return `<tr>
          <td>${dt}</td>
          <td style="max-width:340px;">${summary}${toppedUp ? ` <span class="badge low">⚡ เบิกจากคลังกลาง</span>` : ""}</td>
          <td>${money(total)}</td>
          <td><span class="status-pill ${o.status}">${statusText}</span></td>
          <td><button class="btn btn-ghost btn-sm" data-receipt="${o.id}">📄 ใบเสร็จ</button></td>
        </tr>`;
      }).join("");

      tbody.querySelectorAll("[data-receipt]").forEach(btn => {
        btn.onclick = () => {
          const order = orders.find(o => o.id === btn.dataset.receipt);
          if (order) downloadReceiptPdf(order);
        };
      });
    }

    function renderGrid() {
      const grid = document.getElementById("product-grid");
      const term = searchTerm.trim().toLowerCase();
      const filtered = products.filter(p => {
        const st = stockStatus(p);
        if (filter === "available" && st === "out") return false;
        if (filter === "out" && st !== "out") return false;
        if (term && !(p.name.toLowerCase().includes(term) || p.code.includes(term))) return false;
        return true;
      });
      document.getElementById("empty").style.display = filtered.length ? "none" : "block";
      grid.innerHTML = filtered.map(p => {
        const st = stockStatus(p);
        const pct = p.combined > 0 ? Math.max(6, Math.min(100, (p.team_remaining / p.combined) * 100)) : 0;
        const inCart = cart[p.code] || 0;
        const centralNote = p.central_remaining > 0
          ? `<div class="muted" style="font-size:.72rem;">คลังกลางเหลือ ${p.central_remaining} ชิ้น (เบิกเพิ่มได้ถ้าซื้อเกิน)</div>`
          : "";
        return `
        <div class="p-card">
          <div class="code mono">${escapeHtml(p.code)}</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <span class="badge ${st}">${statusLabel(st)} · ทีมนี้มี ${p.team_remaining}</span>
          <div class="stock-bar ${st}"><div style="width:${pct}%"></div></div>
          ${centralNote}
          <div class="qty-row">
            <button class="qbtn" data-act="minus" data-code="${p.code}" ${st === "out" ? "disabled" : ""}>−</button>
            <input type="number" min="0" value="${inCart}" data-code="${p.code}" ${st === "out" ? "disabled" : ""}>
            <button class="qbtn" data-act="plus" data-code="${p.code}" ${st === "out" ? "disabled" : ""}>+</button>
          </div>
        </div>`;
      }).join("");

      grid.querySelectorAll(".qbtn").forEach(b => {
        b.onclick = () => {
          const code = b.dataset.code;
          const p = products.find(x => x.code === code);
          let q = cart[code] || 0;
          q += b.dataset.act === "plus" ? 1 : -1;
          q = Math.max(0, Math.min(q, p.combined));
          setCartQty(code, q);
        };
      });
      grid.querySelectorAll("input[type=number]").forEach(inp => {
        inp.onchange = () => {
          const code = inp.dataset.code;
          const p = products.find(x => x.code === code);
          let q = Math.max(0, Math.min(parseInt(inp.value || "0", 10) || 0, p.combined));
          setCartQty(code, q);
        };
      });
    }

    function setCartQty(code, qty) {
      if (qty <= 0) delete cart[code];
      else cart[code] = qty;
      renderGrid();
      renderCartBar();
    }

    function renderCartBar() {
      const codes = Object.keys(cart);
      const bar = document.getElementById("cart-bar");
      if (codes.length === 0) { bar.style.display = "none"; return; }
      bar.style.display = "flex";
      document.getElementById("cart-count").textContent = codes.length;
      const preview = codes.slice(0, 3).map(c => products.find(p => p.code === c)?.name).join(", ");
      document.getElementById("cart-preview").textContent = preview + (codes.length > 3 ? " ..." : "");
    }

    function renderCartModal() {
      const codes = Object.keys(cart);
      const linesEl = document.getElementById("cart-lines");
      let total = 0;
      let willTopUp = false;
      linesEl.innerHTML = codes.map(code => {
        const p = products.find(x => x.code === code);
        const qty = cart[code];
        const lineTotal = (p.price || 0) * qty;
        total += lineTotal;
        const needsTopUp = qty > p.team_remaining;
        if (needsTopUp) willTopUp = true;
        return `<div class="cart-line">
          <span class="nm">${escapeHtml(p.name)} × ${qty}${needsTopUp ? ` <span class="badge low">⚡ เบิกกลาง ${qty - p.team_remaining}</span>` : ""}</span>
          <span class="mono">${money(lineTotal)}</span>
          <button class="rm" data-code="${code}">ลบ</button>
        </div>`;
      }).join("") || `<p class="muted">ยังไม่มีสินค้าในตะกร้า</p>`;
      document.getElementById("cart-total").textContent = `รวมทั้งหมด: ${money(total)} บาท`;
      document.getElementById("cart-warn").innerHTML = willTopUp
        ? `<div class="error-msg" style="background:var(--amber-soft);color:#7a4a12;border-color:#e3c48b;">⚡ บางรายการมีในทีมไม่พอ ระบบจะเบิกเพิ่มจากคลังกลางให้อัตโนมัติเมื่อยืนยัน</div>`
        : "";
      linesEl.querySelectorAll(".rm").forEach(btn => {
        btn.onclick = () => { setCartQty(btn.dataset.code, 0); renderCartModal(); };
      });
    }

    document.getElementById("open-cart-btn").onclick = () => {
      renderCartModal();
      document.getElementById("cart-msg").innerHTML = "";
      document.getElementById("cart-modal").style.display = "flex";
    };
    document.getElementById("cancel-cart-btn").onclick = () => {
      document.getElementById("cart-modal").style.display = "none";
    };

    document.getElementById("confirm-cart-btn").onclick = async () => {
      const codes = Object.keys(cart);
      const msgEl = document.getElementById("cart-msg");
      msgEl.innerHTML = "";
      if (codes.length === 0) { msgEl.innerHTML = `<div class="error-msg">ยังไม่มีสินค้าในตะกร้า</div>`; return; }
      const btn = document.getElementById("confirm-cart-btn");
      btn.disabled = true;
      btn.textContent = "กำลังบันทึก...";
      try {
        const items = codes.map(code => ({ code, qty: cart[code] }));
        const { data, error } = await sb().rpc("purchase_cart", {
          p_team: session.team,
          p_password: session.password,
          p_items: items,
        });
        if (error) throw error;
        msgEl.innerHTML = data?.topped_up
          ? `<div class="ok-msg">ซื้อสำเร็จ! บางรายการเบิกเพิ่มจากคลังกลางให้อัตโนมัติ</div>`
          : `<div class="ok-msg">ซื้อสำเร็จ! สต็อกถูกตัดเรียบร้อยแล้ว</div>`;
        cart = {};
        renderCartBar();
        await loadProducts();
        await loadOrders();
        setTimeout(() => { document.getElementById("cart-modal").style.display = "none"; }, 1100);
      } catch (e) {
        msgEl.innerHTML = `<div class="error-msg">${escapeHtml(friendlyError(e))}</div>`;
        await loadProducts(); // stock may have changed under us — refresh
      } finally {
        btn.disabled = false;
        btn.textContent = "ยืนยันการซื้อ";
      }
    };

    document.querySelectorAll(".filter-chip").forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        filter = chip.dataset.f;
        renderGrid();
      };
    });
    document.getElementById("search").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      renderGrid();
    });
    document.getElementById("refresh-btn").onclick = () => { loadProducts(); toast("รีเฟรชสต็อกแล้ว"); };

    loadProducts();
    loadOrders();
  </script>
</body>
</html>
